name: Evaluation checks

on:
  pull_request:
    paths:
      - 'src/evaluation/**'
      - 'tests/evaluation/**'
      - 'docs/evaluation/**'
      - 'configs/evaluation/**'
      - '.github/workflows/evaluation.yml'
  push:
    branches: [main]
    paths:
      - 'src/evaluation/**'
      - 'tests/evaluation/**'
      - 'docs/evaluation/**'
      - 'configs/evaluation/**'
      - '.github/workflows/evaluation.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/evaluation/roleplay_annotation_platform/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install evaluation dependencies
        run: python -m pip install -r src/evaluation/roleplay_annotation_platform/requirements.txt
      - name: Offline regression tests
        run: python -m unittest discover -s tests/evaluation -v
      - name: Conversation rubric sync
        run: python -m src.evaluation.roleplay_annotation_platform.build_conversation_docs --check
      - name: Browser JavaScript syntax
        run: |
          for file in src/evaluation/roleplay_annotation_platform/static/*.js src/evaluation/roleplay_annotation_platform/static_filter_v2/*.js src/evaluation/roleplay_annotation_platform/static_conversation/*.js; do
            node --check "$file"
          done
